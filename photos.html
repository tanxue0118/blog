<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="static/logo.jpg">
    <meta name="description" content="叹雪的小本本 - 相册">
    <meta property="og:site_name" content="叹雪的小本本">
    <meta property="og:type" content="website">
    <meta property="og:title" content="相册 - 叹雪的小本本">
    <meta property="og:description" content="记录拍过的照片">
    <meta property="og:image" content="static/logo.jpg">
    <title>相册 - 叹雪的小本本</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css">
    <link rel="stylesheet" href="static/style.css">
</head>

<body>
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
            <div class="sidebar-header">
                <div class="avatar">
                    <img src="static/logo.jpg" alt="头像">
                </div>
                <h2 class="sidebar-name">叹雪</h2>
                <p class="sidebar-bio">记录一切</p>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="sidebar-link">
                    <i class="ri-home-4-line"></i>
                    <span>首页</span>
                </a>
                <a href="archive.html" class="sidebar-link">
                    <i class="ri-archive-line"></i>
                    <span>归档</span>
                </a>
                <a href="photos.html" class="sidebar-link active">
                    <i class="ri-image-line"></i>
                    <span>相册</span>
                </a>
                <a href="https://github.com/tanxue0118" target="_blank" class="sidebar-link">
                    <i class="ri-github-line"></i>
                    <span>GitHub</span>
                </a>
                <a href="https://tanxue.qzz.io/" target="_blank" class="sidebar-link">
                    <i class="ri-links-line"></i>
                    <span>个人主页</span>
                </a>
            </nav>

            <div class="sidebar-tags">
                <h3 class="sidebar-section-title">标签</h3>
                <div class="tag-list" id="page-tag-list"></div>
            </div>

            <div class="sidebar-stats">
                <h3 class="sidebar-section-title">统计</h3>
                <img
                    class="counter-image"
                    src="https://count.getloli.com/@tanxue0118-blog?theme=moebooru&darkmode=auto"
                    alt="主页访问统计"
                >
            </div>

            <div class="sidebar-footer">
                <button id="theme-toggle" class="theme-toggle">
                    <i class="ri-moon-line"></i>
                    <span>深色模式</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- 遮罩层 -->
    <div class="overlay" id="overlay"></div>

    <!-- 主内容 -->
    <div class="main-wrapper">
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-btn" id="menu-btn">
                    <i class="ri-menu-line"></i>
                </button>
                <button class="sidebar-toggle" id="sidebar-toggle" title="收起侧边栏">
                    <i class="ri-side-bar-line"></i>
                </button>
            </div>
            <h1 class="topbar-title">相册</h1>
            <button class="theme-btn" id="theme-btn">
                <i class="ri-moon-line"></i>
            </button>
        </header>

        <main class="main">
            <div class="container">
                <div class="album-tabs" id="album-tabs">
                    <!-- 相册分组由 JavaScript 动态生成 -->
                </div>

                <div class="photo-grid" id="photo-grid">
                    <!-- 照片网格由 JavaScript 动态生成 -->
                </div>

                <p class="photo-empty" id="photo-empty" hidden>这个相册还没有照片</p>
            </div>
        </main>

        <footer class="footer">
            <p>叹雪的小本本</p>
        </footer>
    </div>

    <!-- 图片灯箱 -->
    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" alt="">
        <div class="lightbox-caption" id="lightbox-caption"></div>
        <button class="lightbox-prev" id="lightbox-prev" title="上一张"><i class="ri-arrow-left-s-line"></i></button>
        <button class="lightbox-next" id="lightbox-next" title="下一张"><i class="ri-arrow-right-s-line"></i></button>
    </div>

    <script src="static/script.js"></script>
    <script>
        (function() {
            var grid = document.getElementById('photo-grid');
            var emptyTip = document.getElementById('photo-empty');
            var tabsEl = document.getElementById('album-tabs');
            var lightbox = document.getElementById('lightbox');
            var lightboxImg = document.getElementById('lightbox-img');
            var lightboxCaption = document.getElementById('lightbox-caption');
            var prevBtn = document.getElementById('lightbox-prev');
            var nextBtn = document.getElementById('lightbox-next');

            var allEntries = [];
            var currentAlbum = '全部';
            var currentIndex = 0;
            var filteredEntries = [];  // 网格条目（group / photo / text）
            var lightboxPhotos = [];   // 展开后的纯照片列表 [{file,title,date}...]，用于灯箱
            var escMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
            function escHtml(s) {
                return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return escMap[c]; });
            }

            // 加载侧边栏标签
            fetch('posts/data.json')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var tagList = document.getElementById('page-tag-list');
                    if (tagList && data.tags) {
                        var html = '';
                        for (var j = 0; j < data.tags.length; j++) {
                            var t = data.tags[j];
                            var href = t === '全部' ? 'index.html' : 'index.html?tag=' + encodeURIComponent(t);
                            html += '<a href="' + href + '" class="tag-item">' + t + '</a>';
                        }
                        tagList.innerHTML = html;
                    }
                })
                .catch(function() {});

            // 加载相册数据
            fetch('photos/data.json')
                .then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function(data) {
                    var albums = data.albums || ['全部'];
                    allEntries = (data.entries || []).slice().sort(function(a, b) {
                        return (b.date || '').localeCompare(a.date || '');
                    });

                    renderTabs(albums);
                    applyFilter();
                })
                .catch(function(err) {
                    console.error('加载相册失败:', err);
                    grid.innerHTML = '<p style="text-align:center;color:#999;padding:40px;grid-column:1/-1;">加载相册失败</p>';
                });

            function renderTabs(albums) {
                var html = '';
                for (var i = 0; i < albums.length; i++) {
                    var a = albums[i];
                    var active = a === currentAlbum ? ' active' : '';
                    html += '<button class="album-tab' + active + '" data-album="' + a + '">' + a + '</button>';
                }
                tabsEl.innerHTML = html;

                var tabs = tabsEl.querySelectorAll('.album-tab');
                for (var j = 0; j < tabs.length; j++) {
                    tabs[j].onclick = function() {
                        currentAlbum = this.getAttribute('data-album');
                        for (var k = 0; k < tabs.length; k++) tabs[k].classList.remove('active');
                        this.classList.add('active');
                        applyFilter();
                    };
                }
            }

            function applyFilter() {
                if (currentAlbum === '全部') {
                    filteredEntries = allEntries;
                } else {
                    filteredEntries = allEntries.filter(function(e) {
                        return e.album === currentAlbum;
                    });
                }
                // 把所有条目展开成纯照片序列（组内照片按 files 顺序），供灯箱使用
                lightboxPhotos = [];
                for (var i = 0; i < filteredEntries.length; i++) {
                    var e = filteredEntries[i];
                    var t = e.type || 'photo';
                    if (t === 'text') continue;
                    if (t === 'group') {
                        var files = e.files || [];
                        for (var j = 0; j < files.length; j++) {
                            lightboxPhotos.push({ file: files[j] });
                        }
                    } else if (e.file) {
                        lightboxPhotos.push({ file: e.file });
                    }
                }
                renderGrid();
            }

            function thumbFile(name) {
                var lower = name.toLowerCase();
                if (lower.slice(-4) === '.gif') return name;
                return name.replace(/\.[^.]+$/, '.jpg');
            }

            function renderGrid() {
                if (filteredEntries.length === 0) {
                    grid.innerHTML = '';
                    emptyTip.hidden = false;
                    return;
                }
                emptyTip.hidden = true;

                // 先按日期分组（条目已按日期倒序）
                var dayGroups = [];
                var dayMap = {};
                for (var i = 0; i < filteredEntries.length; i++) {
                    var e = filteredEntries[i];
                    var d = e.date || '未知日期';
                    if (!dayMap[d]) {
                        dayMap[d] = { date: d, entries: [] };
                        dayGroups.push(dayMap[d]);
                    }
                    dayMap[d].entries.push(e);
                }

                var html = '';
                var lbCounter = 0;  // 与 lightboxPhotos 展开顺序严格一致

                for (var g = 0; g < dayGroups.length; g++) {
                    var day = dayGroups[g];
                    html += '<div class="day-section">';

                    // 日期头：取当天第一个有 location/weather 的条目做 meta 展示
                    var loc = '', weather = '';
                    for (var m = 0; m < day.entries.length; m++) {
                        if (!loc && day.entries[m].location) loc = day.entries[m].location;
                        if (!weather && day.entries[m].weather) weather = day.entries[m].weather;
                    }
                    html += '<div class="day-header">';
                    html += '<h2 class="day-date">' + escHtml(day.date) + '</h2>';
                    var meta = '';
                    if (loc) meta += '<span class="day-meta-item"><i class="ri-map-pin-line"></i>' + escHtml(loc) + '</span>';
                    if (weather) meta += '<span class="day-meta-item"><i class="ri-sun-line"></i>' + escHtml(weather) + '</span>';
                    if (meta) html += '<div class="day-meta">' + meta + '</div>';
                    html += '</div>';

                    // 当天的条目（时间线）
                    for (var i2 = 0; i2 < day.entries.length; i2++) {
                        var e2 = day.entries[i2];
                        var t = e2.type || 'photo';

                        if (t === 'text') {
                            html += '<div class="text-card">';
                            html += '<p class="text-card-body">' + escHtml(e2.text).replace(/\n/g, '<br>') + '</p>';
                            html += '</div>';
                            continue;
                        }

                        if (t === 'group') {
                            var files = e2.files || [];
                            html += '<div class="photo-group">';
                            var gh = '';
                            if (e2.title) gh += '<h3 class="photo-group-title">' + escHtml(e2.title) + '</h3>';
                            var gmeta = '';
                            if (e2.location) gmeta += '<span class="day-meta-item"><i class="ri-map-pin-line"></i>' + escHtml(e2.location) + '</span>';
                            if (e2.weather) gmeta += '<span class="day-meta-item"><i class="ri-sun-line"></i>' + escHtml(e2.weather) + '</span>';
                            if (gmeta) gh += '<div class="day-meta">' + gmeta + '</div>';
                            if (gh) html += '<div class="photo-group-head">' + gh + '</div>';
                            if (e2.text) {
                                html += '<p class="photo-group-text">' + escHtml(e2.text).replace(/\n/g, '<br>') + '</p>';
                            }
                            html += '<div class="photo-group-grid">';
                            for (var j = 0; j < files.length; j++) {
                                html += '<div class="photo-group-item" data-lbindex="' + lbCounter + '">';
                                html += '<img src="photos/thumbs/small/' + encodeURIComponent(thumbFile(files[j])) + '" alt="" loading="lazy">';
                                html += '</div>';
                                lbCounter++;
                            }
                            html += '</div></div>';
                            continue;
                        }

                        // 单张照片：占满整行的卡片
                        html += '<div class="photo-single">';
                        var sh = '';
                        if (e2.title) sh += '<h3 class="photo-group-title">' + escHtml(e2.title) + '</h3>';
                        var smeta = '';
                        if (e2.location) smeta += '<span class="day-meta-item"><i class="ri-map-pin-line"></i>' + escHtml(e2.location) + '</span>';
                        if (e2.weather) smeta += '<span class="day-meta-item"><i class="ri-sun-line"></i>' + escHtml(e2.weather) + '</span>';
                        if (smeta) sh += '<div class="day-meta">' + smeta + '</div>';
                        if (sh) html += '<div class="photo-group-head">' + sh + '</div>';
                        if (e2.text) {
                            html += '<p class="photo-group-text">' + escHtml(e2.text).replace(/\n/g, '<br>') + '</p>';
                        }
                        html += '<div class="photo-single-img" data-lbindex="' + lbCounter + '">';
                        html += '<img src="photos/thumbs/small/' + encodeURIComponent(thumbFile(e2.file)) + '" alt="" loading="lazy">';
                        html += '</div></div>';
                        lbCounter++;
                    }

                    html += '</div>';
                }
                grid.innerHTML = html;

                var items = grid.querySelectorAll('.photo-group-item, .photo-single-img');
                for (var j2 = 0; j2 < items.length; j2++) {
                    items[j2].onclick = function() {
                        currentIndex = parseInt(this.getAttribute('data-lbindex'), 10);
                        showLightbox();
                    };
                }
            }

            function showLightbox() {
                var p = lightboxPhotos[currentIndex];
                if (!p) return;
                var file = encodeURIComponent(thumbFile(p.file));
                lightboxImg.src = 'photos/thumbs/large/' + file;
                lightboxImg.alt = '';
                lightboxCaption.textContent = '';
                lightbox.classList.add('show');
                document.body.style.overflow = 'hidden';
                updateNavButtons();
            }

            function closeLightbox() {
                lightbox.classList.remove('show');
                document.body.style.overflow = '';
            }

            function updateNavButtons() {
                var single = lightboxPhotos.length <= 1;
                prevBtn.style.display = single ? 'none' : '';
                nextBtn.style.display = single ? 'none' : '';
            }

            function prevPhoto() {
                if (lightboxPhotos.length <= 1) return;
                currentIndex = (currentIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
                showLightbox();
            }

            function nextPhoto() {
                if (lightboxPhotos.length <= 1) return;
                currentIndex = (currentIndex + 1) % lightboxPhotos.length;
                showLightbox();
            }

            lightbox.onclick = function(e) {
                if (e.target === lightbox) closeLightbox();
            };
            prevBtn.onclick = function(e) { e.stopPropagation(); prevPhoto(); };
            nextBtn.onclick = function(e) { e.stopPropagation(); nextPhoto(); };

            document.addEventListener('keydown', function(e) {
                if (!lightbox.classList.contains('show')) return;
                if (e.key === 'Escape') closeLightbox();
                else if (e.key === 'ArrowLeft') prevPhoto();
                else if (e.key === 'ArrowRight') nextPhoto();
            });
        })();
    </script>
</body>

</html>
